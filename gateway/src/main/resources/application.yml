server:
  port: 9000

spring:
  profiles:
    active: @profileActive@
  application:
    name: jy-gateway
  cloud:
    gateway:
      routes:
        - id: jy-user
          uri: lb://jy-user
          predicates:
            - Path=/jy-user/**
          filters:
            - StripPrefix=1
        - id: jy-setting
          uri: lb://jy-setting
          predicates:
            - Path=/jy-setting/**
          filters:
            - StripPrefix=1
        - id: jy-ucenter
          uri: lb://jy-ucenter
          predicates:
            - Path=/jy-ucenter/**
          filters:
            - StripPrefix=1

logging:
  level:
    com.jycloud.gateway: DEBUG  # 你的过滤器日志级别
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# ✅ Knife4j 聚合配置
knife4j:
  enable: true
  gateway:
    enabled: true
    strategy: discover  # manual(手动) 或 discover(自动)
